name: Monthly Contribution Grid

on:
  schedule:
    - cron: "0 5 * * *" # daily refresh
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate current-month 3D grid
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          MONTH=$(date -u +%Y-%m)
          gh api graphql -f query='query($u:String!){ user(login:$u){ contributionsCollection{ contributionCalendar{ weeks{ contributionDays{ date contributionCount weekday } } } } } }' -f u="$OWNER" \
            --jq "[.data.user.contributionsCollection.contributionCalendar.weeks[].contributionDays[] | select(.date|startswith(\"$MONTH\"))]" \
            | python scripts/gen_month_grid.py assets/month-grid.svg

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/month-grid.svg
          git commit -m "chore: refresh monthly contribution grid" || echo "no changes"
          git push
